name: Screenshot Windows

# Tries to answer the last open architectural question: does the transparent
# overlay composite over the live panels on Windows?
#
# IT CANNOT RUN ON THE CURRENT RUNNER. The self-hosted Windows runner is
# registered as a service, so it has no interactive desktop and CopyFromScreen
# fails with "the handle is invalid". Kept because it works unchanged on any
# Windows machine with someone logged in, which is where this question has to be
# settled anyway.
#
# Everything else about Windows is already covered. The probes confirm the view
# APIs and the fullscreen paths, and the self-test confirms main.js behaves. All
# of that proves the app RUNS. None of it proves the wall LOOKS right, because
# nothing has ever looked at it.
#
# The app's own capture tool cannot answer this either: it composites the panels
# and the overlay onto a canvas itself, which is precisely the step being tested.
# Only a screen grab taken by the operating system shows what the OS actually
# composited, which is why this uses one.
on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: [self-hosted, Windows]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm ci

      # Before assuming anything about why a capture fails: is there a desktop,
      # and is this process in the session that owns it? A runner can be on a
      # machine with a perfectly good desktop and still be unable to see it,
      # because a service runs in session 0 and the desktop is in session 1.
      - name: Diagnose the session
        shell: pwsh
        continue-on-error: true
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Write-Host "user:                $([Environment]::UserName)"
          Write-Host "UserInteractive:     $([Environment]::UserInteractive)"
          Write-Host "process session id:  $((Get-Process -Id $PID).SessionId)"
          Write-Host "screen count:        $([System.Windows.Forms.Screen]::AllScreens.Count)"
          foreach ($s in [System.Windows.Forms.Screen]::AllScreens) {
            Write-Host "  $($s.DeviceName) $($s.Bounds.Width)x$($s.Bounds.Height) primary=$($s.Primary)"
          }
          Write-Host "--- sessions on this machine (qwinsta) ---"
          try { qwinsta } catch { Write-Host "qwinsta unavailable: $_" }
          Write-Host "--- runner service, if it is one ---"
          try {
            Get-CimInstance Win32_Service |
              Where-Object { $_.Name -like '*actions*' -or $_.PathName -like '*actions-runner*' } |
              Select-Object Name, StartName, State, PathName | Format-List
          } catch { Write-Host "service query failed: $_" }

      - name: Run the wall and grab the screen
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing

          # Edit mode on purpose. The overlay is invisible in grid mode by
          # design, so a grid screenshot proves nothing either way. In edit mode
          # it draws panel frames, handles and a toolbar. If those appear ON TOP
          # of the panel content, compositing works. If the screen is blank or
          # the panels are hidden behind an opaque layer, it does not.
          $env:WALLWRIGHT_DEV = '1'
          $env:WALLWRIGHT_START_EDIT = '1'
          $env:WALLWRIGHT_CONFIG = 'config/screenshot.json'

          # Written to a file rather than read from stdout: requiring electron can
          # print its own chatter, and PowerShell then hands Start-Process an
          # array instead of a path.
          node -e "require('fs').writeFileSync('electron-path.txt', require('electron'))"
          $electron = (Get-Content electron-path.txt -Raw).Trim()
          Write-Host "electron: $electron"
          if (-not (Test-Path $electron)) { throw "electron not found at $electron" }
          $proc = Start-Process -FilePath $electron -ArgumentList '.' -PassThru

          try {
            Start-Sleep -Seconds 20  # let it start, go fullscreen and settle

            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            Write-Host "screen: $($bounds.Width)x$($bounds.Height)"
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $gfx = [System.Drawing.Graphics]::FromImage($bmp)
            try {
              $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            }
            catch {
              # "The handle is invalid" means there is no desktop to copy from.
              Write-Host "::error::This runner has no interactive desktop, so the screen cannot be captured. A Windows runner registered as a service has no session attached. Compositing can only be checked on a Windows machine with someone logged in: the show PC, or any desktop with a display."
              throw
            }
            New-Item -ItemType Directory -Force -Path shot | Out-Null
            $bmp.Save("$PWD\shot\windows-wall.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $gfx.Dispose(); $bmp.Dispose()
            Write-Host "saved shot\windows-wall.png"
          }
          finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-wall-screenshot
          path: shot/*.png
          if-no-files-found: error
