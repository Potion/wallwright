name: Build macOS

# Runs on the org-level self-hosted macOS runner (Brooklyn-Studio), the same
# pair touch-table-sim uses. A GitHub-hosted macOS runner bills at 10x on a
# private repo.
#
# The org runner group must grant this repository access. If a job sits queued
# forever, that is what is missing.
#
# The exhibit itself runs on Windows; the macOS build exists for development and
# for showing the thing to people on their own machines.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to the triggering ref)'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

concurrency:
  group: build-mac
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, macOS]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # electron-builder can produce the x64 build from an arm64 Mac but not the
      # other way round, so fail early and clearly rather than silently shipping
      # one architecture.
      - name: Confirm Apple Silicon
        run: |
          set -euo pipefail
          arch=$(uname -m)
          if [ "$arch" != "arm64" ]; then
            echo "::error::This runner is $arch. An arm64 Mac is needed to build both architectures."
            exit 1
          fi
          echo "runner arch: $arch"

      # See the Windows job: the working directory persists between runs.
      - name: Clear previous build output
        run: node -e "require('fs').rmSync('dist',{recursive:true,force:true})"

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Both arm64 and x64 dmgs. Unsigned: there is no Developer ID certificate,
      # so Gatekeeper will quarantine these on any machine that downloads them.
      - name: Build dmgs
        run: npm run build:mac

      - name: Attach to the release
        if: startsWith(env.TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*.dmg
          fail_on_unmatched_files: true

      - name: Upload workflow artifacts (non-tag runs)
        if: ${{ !startsWith(env.TAG, 'v') }}
        uses: actions/upload-artifact@v7
        with:
          name: forge-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
