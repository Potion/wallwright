name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # The one remaining GitHub-hosted job, and the cheapest tier: Linux at 1x for
    # about fifteen seconds a push. It stays hosted deliberately, as an
    # independent signal that does not depend on the self-hosted runners being
    # reachable, since the builds now do.
    #
    # There used to be a windows-latest job here too, at 2x on every push. Its
    # lint and test coverage moved into build-windows.yml, which runs both on the
    # self-hosted Windows runner before packaging.
    name: lint + test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts skips Electron's ~100MB binary download. The linters
      # and the unit tests never touch Electron: they cover src/config.js and
      # src/layout.js, which are deliberately electron-free. The build workflow
      # does a full install.
      - run: npm ci --ignore-scripts

      - run: npm run lint

      - run: npm test
