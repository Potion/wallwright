name: Build Windows

# Runs on the org-level self-hosted Windows runner (PROTO1-P8), the same pair
# touch-table-sim uses. GitHub-hosted runners bill at 2x for Windows and 10x for
# macOS on a private repo, which is why nothing here uses them.
#
# The org runner group must grant this repository access. If a job sits queued
# forever, that is what is missing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (defaults to the triggering ref)'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write # to attach build artifacts to a release

env:
  # The tag being released, whether this was a tag push or a manual re-run.
  TAG: ${{ github.event.inputs.ref || github.ref_name }}

# The runner reuses one working directory, so two builds at once would fight
# over it.
concurrency:
  group: build-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Windows]

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # A self-hosted runner keeps its working directory between runs, and dist/
      # is gitignored so checkout leaves it in place. Artifacts from an older
      # version would otherwise be swept up by the release upload below. node
      # rather than a shell builtin, so this does not depend on the runner's
      # shell.
      - name: Clear previous build output
        run: node -e "require('fs').rmSync('dist',{recursive:true,force:true})"

      - run: npm ci

      # Do not ship something that does not pass its own checks. This is also
      # where Windows gets its lint and test coverage, since CI no longer runs a
      # hosted Windows job.
      - run: npm run lint
      - run: npm test

      # The only coverage src/main.js has: it drives the real app over IPC,
      # checking panel CRUD, overlay visibility in every mode, preset recall,
      # and the refresh and recycle timers. Needs a real display, which the
      # self-hosted runners have and the hosted Linux CI job does not, so this
      # is the only place it can run.
      #
      # Gating, not advisory. It exits non-zero and names what failed, and it
      # polls for conditions rather than sleeping, so a loaded runner does not
      # make it flake. If it ever does flake, fix the test rather than adding
      # continue-on-error: a smoke test people learn to ignore is worse than
      # none.
      - name: Self-test
        run: npm run selftest

      - name: Build installer and zip
        run: npm run build:win

      # Unsigned for now: there is no certificate yet. Once there is one, add
      # CSC_LINK and CSC_KEY_PASSWORD as repository secrets and pass them as env
      # here; electron-builder picks them up with no config change.
      #
      # A javascript action rather than the gh cli: gh is not installed on this
      # hand-provisioned runner, and assuming it exists is how touch-table-sim's
      # first release attempt failed.
      - name: Attach to the release
        if: startsWith(env.TAG, 'v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.exe
            dist/*.zip
          fail_on_unmatched_files: true

      - name: Upload workflow artifacts (non-tag runs)
        if: ${{ !startsWith(env.TAG, 'v') }}
        uses: actions/upload-artifact@v7
        with:
          name: forge-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
