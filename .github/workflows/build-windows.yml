name: Build Windows

# Not on every push: Windows runners bill at 2x on a private repo, and a build
# downloads the Electron binary. Tag a release or run it by hand.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write # to attach build artifacts to a release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cache Electron and builder downloads
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-electron-

      - run: npm ci

      # Do not ship something that does not pass its own checks.
      - run: npm run lint
      - run: npm test

      - name: Build installer and zip
        run: npm run build:win

      # Unsigned for now: there is no certificate yet. Once there is one, add
      # CSC_LINK and CSC_KEY_PASSWORD as repository secrets and pass them as env
      # here; electron-builder picks them up with no config change. A signed
      # build is easier for Honeywell IT to approve.
      - name: List what was produced
        run: Get-ChildItem dist -File | Select-Object Name, Length
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: forge-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

      # On a tag, attach the build to that release. Uploaded from the runner, so
      # a release does not mean downloading a few hundred MB of workflow
      # artifacts and pushing them back up by hand.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${{ github.ref_name }}" dist/*.exe dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
