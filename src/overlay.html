<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: Helvetica, Arial, sans-serif;
        cursor: default;
        user-select: none;
      }
      #root {
        position: absolute;
        inset: 0;
      }

      /* Grid-mode click targets: invisible unless hinting on hover. */
      .hotspot {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        box-sizing: border-box;
      }
      body.hint .hotspot:hover {
        border: 3px solid rgba(240, 78, 35, 0.9); /* Hyperquake Poppy */
        background: rgba(240, 78, 35, 0.06);
      }

      /* Active-mode Back button fills the shrunk corner overlay. */
      .back {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.65);
        color: #ffffff;
        font-size: 16px;
        font-family: inherit;
      }
      .back:hover {
        background: rgba(240, 78, 35, 0.9);
      }

      /* ---- layout edit mode ---- */
      /* Bottom, not top. Centred at the top is exactly where a MacBook's camera
         housing sits, which cut the middle out of this bar. Nothing on any Mac
         obstructs the bottom edge, and on the wall it reads the same either
         way. */
      .editbar {
        position: absolute;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 10px 10px 0 0;
        background: rgba(0, 0, 0, 0.82);
        color: #e6edf3;
        font-size: 14px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        z-index: 10;
      }
      .editbar strong {
        color: #f04e23;
        margin-right: 8px;
      }
      .editbar kbd {
        font: inherit;
        border: 1px solid #57606a;
        border-radius: 4px;
        padding: 1px 5px;
        margin: 0 1px;
      }

      /* Snap guides: drawn across the whole wall so it is obvious which edge a
         panel locked onto. */
      .guides {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      .guide {
        position: absolute;
        background: #00e5ff;
      }
      .guide-v {
        width: 1px;
      }
      .guide-h {
        height: 1px;
      }

      .editbar {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .barhint {
        opacity: 0.85;
      }
      .addbtn {
        font: inherit;
        font-weight: 600;
        color: #ffffff;
        background: rgba(240, 78, 35, 0.9);
        border: 0;
        border-radius: 6px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .addbtn:hover {
        background: #f04e23;
      }

      /* Named montages, in the edit toolbar. */
      .presets {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preset-label {
        color: #8b949e;
        margin-right: 2px;
      }
      .preset {
        display: inline-flex;
        align-items: stretch;
        border: 1px solid #30363d;
        border-radius: 6px;
        overflow: hidden;
      }
      .preset.active {
        border-color: #f04e23;
      }
      .preset-use,
      .preset-del,
      .preset-save {
        font: inherit;
        border: 0;
        cursor: pointer;
        background: #21262d;
        color: #e6edf3;
        padding: 4px 9px;
      }
      .preset-use:hover,
      .preset-save:hover {
        background: rgba(240, 78, 35, 0.9);
      }
      .preset.active .preset-use {
        color: #f04e23;
        font-weight: 600;
      }
      .preset-del {
        padding: 4px 7px;
        color: #8b949e;
        border-left: 1px solid #30363d;
      }
      .preset-del:hover {
        background: #f85149;
        color: #ffffff;
      }
      .preset-save {
        border: 1px dashed #57606a;
        border-radius: 6px;
      }
      .preset-name {
        font: inherit;
        padding: 4px 9px;
        border-radius: 6px;
        border: 1px solid #f04e23;
        background: #161b22;
        color: #e6edf3;
        min-width: 200px;
      }

      /* Rubber band while drawing a new panel. */
      .band {
        position: absolute;
        box-sizing: border-box;
        border: 2px dashed #00e5ff;
        background: rgba(0, 229, 255, 0.1);
        pointer-events: none;
        z-index: 8;
      }

      /* Inspector for the selected panel. */
      .inspector {
        position: absolute;
        right: 24px;
        top: 24px;
        width: 340px;
        box-sizing: border-box;
        padding: 16px 18px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.88);
        color: #e6edf3;
        font-size: 13px;
        z-index: 11;
      }
      .insp-head {
        font-family: ui-monospace, Menlo, monospace;
        font-weight: 600;
        color: #f04e23;
        margin-bottom: 12px;
      }
      .insp-empty {
        color: #8b949e;
        line-height: 1.5;
      }
      .insp-field {
        display: block;
        margin-bottom: 10px;
      }
      .insp-field span {
        display: block;
        color: #8b949e;
        margin-bottom: 4px;
      }
      .insp-field input,
      .insp-field select {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 7px 9px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #161b22;
        color: #e6edf3;
      }
      .insp-field input:focus,
      .insp-field select:focus {
        outline: 2px solid rgba(240, 78, 35, 0.9);
        outline-offset: -1px;
      }
      .insp-note {
        color: #8b949e;
        margin: 10px 0 14px;
        line-height: 1.45;
      }
      .insp-open {
        width: 100%;
        font: inherit;
        padding: 8px;
        margin-bottom: 8px;
        border-radius: 6px;
        cursor: pointer;
        color: #ffffff;
        background: rgba(240, 78, 35, 0.9);
        border: 0;
      }
      .insp-open:hover {
        background: #f04e23;
      }
      .insp-del {
        width: 100%;
        font: inherit;
        padding: 8px;
        border-radius: 6px;
        cursor: pointer;
        color: #ffa198;
        background: transparent;
        border: 1px solid #f8514933;
      }
      .insp-del:hover {
        background: #f851491f;
        border-color: #f85149;
      }

      .epanel {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid rgba(240, 78, 35, 0.85);
        background: rgba(240, 78, 35, 0.05);
        cursor: move;
      }
      .epanel.dragging {
        border-color: #ffffff;
        background: rgba(240, 78, 35, 0.14);
      }
      /* Selected reads brighter and solid, so it is obvious which panel the
         inspector is editing. */
      .epanel.selected {
        border-color: #ffffff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6);
      }
      .epanel.selected .elabel {
        background: rgba(240, 78, 35, 0.92);
      }
      .elabel {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        gap: 14px;
        align-items: baseline;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.78);
        color: #e6edf3;
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
      }
      .ename {
        font-weight: 600;
      }
      .eread {
        font-family: ui-monospace, Menlo, monospace;
        color: #7ee787;
      }

      .grip {
        position: absolute;
        width: 18px;
        height: 18px;
        background: #ffffff;
        border: 2px solid rgba(240, 78, 35, 0.95);
        box-sizing: border-box;
      }
      /* Corners: proportional scale. */
      .grip-nw {
        left: -9px;
        top: -9px;
        cursor: nwse-resize;
      }
      .grip-se {
        right: -9px;
        bottom: -9px;
        cursor: nwse-resize;
      }
      .grip-ne {
        right: -9px;
        top: -9px;
        cursor: nesw-resize;
      }
      .grip-sw {
        left: -9px;
        bottom: -9px;
        cursor: nesw-resize;
      }
      /* Sides: single-axis resize. Drawn as bars to read differently from the
         square corner handles, since they do a different thing. */
      .grip-n,
      .grip-s {
        left: 50%;
        margin-left: -18px;
        width: 36px;
        height: 12px;
        cursor: ns-resize;
        border-radius: 6px;
      }
      .grip-n {
        top: -6px;
      }
      .grip-s {
        bottom: -6px;
      }
      .grip-e,
      .grip-w {
        top: 50%;
        margin-top: -18px;
        width: 12px;
        height: 36px;
        cursor: ew-resize;
        border-radius: 6px;
      }
      .grip-e {
        right: -6px;
      }
      .grip-w {
        left: -6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="overlay.js"></script>
  </body>
</html>
