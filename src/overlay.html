<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: Helvetica, Arial, sans-serif;
        cursor: default;
        user-select: none;
      }
      #root {
        position: absolute;
        inset: 0;
      }

      /* Grid-mode click targets: invisible unless hinting on hover. */
      .hotspot {
        position: absolute;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
        box-sizing: border-box;
      }
      body.hint .hotspot:hover {
        border: 3px solid rgba(240, 78, 35, 0.9); /* Hyperquake Poppy */
        background: rgba(240, 78, 35, 0.06);
      }

      /* Active-mode Back button fills the shrunk corner overlay. */
      .back {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        background: rgba(0, 0, 0, 0.65);
        color: #ffffff;
        font-size: 16px;
        font-family: inherit;
      }
      .back:hover {
        background: rgba(240, 78, 35, 0.9);
      }

      /* ---- layout edit mode ---- */
      .editbar {
        position: absolute;
        left: 50%;
        top: 0;
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 0 0 10px 10px;
        background: rgba(0, 0, 0, 0.82);
        color: #e6edf3;
        font-size: 14px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        z-index: 10;
      }
      .editbar strong {
        color: #f04e23;
        margin-right: 8px;
      }
      .editbar kbd {
        font: inherit;
        border: 1px solid #57606a;
        border-radius: 4px;
        padding: 1px 5px;
        margin: 0 1px;
      }

      /* Snap guides: drawn across the whole wall so it is obvious which edge a
         panel locked onto. */
      .guides {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 9;
      }
      .guide {
        position: absolute;
        background: #00e5ff;
      }
      .guide-v {
        width: 1px;
      }
      .guide-h {
        height: 1px;
      }

      .epanel {
        position: absolute;
        box-sizing: border-box;
        border: 2px solid rgba(240, 78, 35, 0.85);
        background: rgba(240, 78, 35, 0.05);
        cursor: move;
      }
      .epanel.dragging {
        border-color: #ffffff;
        background: rgba(240, 78, 35, 0.14);
      }
      .elabel {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        gap: 14px;
        align-items: baseline;
        padding: 6px 10px;
        background: rgba(0, 0, 0, 0.78);
        color: #e6edf3;
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
      }
      .ename {
        font-weight: 600;
      }
      .eread {
        font-family: ui-monospace, Menlo, monospace;
        color: #7ee787;
      }

      .grip {
        position: absolute;
        width: 18px;
        height: 18px;
        background: #ffffff;
        border: 2px solid rgba(240, 78, 35, 0.95);
        box-sizing: border-box;
      }
      /* Corners: proportional scale. */
      .grip-nw {
        left: -9px;
        top: -9px;
        cursor: nwse-resize;
      }
      .grip-se {
        right: -9px;
        bottom: -9px;
        cursor: nwse-resize;
      }
      .grip-ne {
        right: -9px;
        top: -9px;
        cursor: nesw-resize;
      }
      .grip-sw {
        left: -9px;
        bottom: -9px;
        cursor: nesw-resize;
      }
      /* Sides: single-axis resize. Drawn as bars to read differently from the
         square corner handles, since they do a different thing. */
      .grip-n,
      .grip-s {
        left: 50%;
        margin-left: -18px;
        width: 36px;
        height: 12px;
        cursor: ns-resize;
        border-radius: 6px;
      }
      .grip-n {
        top: -6px;
      }
      .grip-s {
        bottom: -6px;
      }
      .grip-e,
      .grip-w {
        top: 50%;
        margin-top: -18px;
        width: 12px;
        height: 36px;
        cursor: ew-resize;
        border-radius: 6px;
      }
      .grip-e {
        right: -6px;
      }
      .grip-w {
        left: -6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="overlay.js"></script>
  </body>
</html>
