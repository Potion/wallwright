<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Locked down because this is the one renderer with a privileged bridge
         attached (src/preload.js). Nothing here loads from anywhere: the page is
         a stylesheet, a script and an empty div, and overlay.js has no fetch, no
         eval and no dynamically created script or style. So default-src can be
         'none' with no exception - which is why the stylesheet lives in
         overlay.css rather than inline, and why style-src does not need
         'unsafe-inline'. Loaded with loadFile(), so 'self' is the sibling file. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="root"></div>
    <!-- layout.js first: it publishes window.WallwrightLayout, which overlay.js
         reads at load. Same file the main process requires, so the snapping is one
         implementation rather than two that drift. -->
    <script src="layout.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
